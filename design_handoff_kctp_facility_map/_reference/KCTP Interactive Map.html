<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KCPT — Cleburne Regional Airport</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* Map the embedded font names from the SVG to Google's Archivo */
    @font-face { font-family: 'Archivo-ExtraBoldItalic'; src: local('Archivo'); font-weight: 800; font-style: italic; }
    @font-face { font-family: 'Archivo-Bold'; src: local('Archivo'); font-weight: 700; font-style: normal; }
    @font-face { font-family: 'Archivo-Black'; src: local('Archivo'); font-weight: 900; font-style: normal; }
    /* Make SVG text use Archivo */
    svg.kctp-map-svg text { font-family: 'Archivo', system-ui, sans-serif !important; }
    svg.kctp-map-svg text[font-family*="ExtraBoldItalic"] { font-weight: 800 !important; font-style: italic !important; }
    svg.kctp-map-svg text[font-family*="Archivo-Bold"] { font-weight: 700 !important; }
    svg.kctp-map-svg text[font-family*="Archivo-Black"] { font-weight: 900 !important; }
    /* Toggleable hangar labels — class controlled from React */
    .kctp-no-labels svg.kctp-map-svg text[fill="#00ADEE"] { display: none; }
    /* Hide the white background card and the AP logo */
    svg.kctp-map-svg [data-bg-card] { display: none; }
    svg.kctp-map-svg [data-logo] { display: none; }
    /* Heavier weight for the big numbers (80,000 / 90,000) and SQFT units */
    svg.kctp-map-svg text tspan { font-family: 'Archivo', system-ui, sans-serif !important; font-weight: 800 !important; }
    /* Drop shadow on the stats card (light blue panel + its dark blue outline) */
    svg.kctp-map-svg path[fill="#EEFAFF"],
    svg.kctp-map-svg path[fill="#eefaff"] {
      filter: drop-shadow(0 8px 18px rgba(20,30,80,0.22)) drop-shadow(0 2px 4px rgba(20,30,80,0.12));
    }
  </style>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F4F1EC; }
    * { box-sizing: border-box; }
    /* Hide scrollbar inside side panels but allow scroll */
    div::-webkit-scrollbar { width: 6px; }
    div::-webkit-scrollbar-track { background: transparent; }
    div::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="map-data.js"></script>
  <script src="map-svg.js"></script>
  <script type="text/babel" src="map-chrome.jsx"></script>
  <script type="text/babel" src="map-panel.jsx"></script>
  <script type="text/babel" src="map-app.jsx"></script>
  <script type="text/babel" src="location-card.jsx"></script>
</body>
</html>
